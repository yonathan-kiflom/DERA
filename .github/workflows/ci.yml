name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install check tools
        run: python -m pip install build==1.2.2.post1 ruff==0.9.10
      - name: Lint
        run: python -m ruff check dera third_party tests configs
      - name: Format check
        run: python -m ruff format --check dera third_party tests configs
      - name: Compile sources
        run: python -m compileall -q dera third_party configs
      - name: Build wheel
        run: python -m build --wheel
      - name: Reject tracked runtime artifacts
        run: |
          if git ls-files | grep -E '\.(pth|pt|ckpt|safetensors|onnx|bin)$|\.pth\.tar$'; then
            echo "Model artifacts must not be committed."
            exit 1
          fi

  cpu-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install CPU test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            torch==2.1.2 torchvision==0.16.2 \
            --index-url https://download.pytorch.org/whl/cpu --no-deps
          python -m pip install \
            mmcv==2.1.0 \
            --find-links https://download.openmmlab.com/mmcv/dist/cpu/torch2.1/index.html
          python -m pip install \
            mmengine==0.10.7 mmdet==3.3.0 transformers==4.28.0 \
            safetensors==0.7.0 fairscale==0.4.13 \
            numpy==1.26.4 opencv-python==4.10.0.84 \
            pycocotools==2.0.7 PyYAML==6.0.2 \
            Pillow==10.4.0 pytest==8.3.5
          python -m pip install \
            filelock fsspec Jinja2 networkx requests sympy typing-extensions
          python -m pip install --no-deps .
      - name: Smoke-test installed package
        run: |
          cd /tmp
          dera --help
          dera doctor
          python -c "from dera.engine import config_path; print(config_path('pidray', 'residual'))"
          python -m pip check
      - name: Run tests
        run: python -m pytest -q
