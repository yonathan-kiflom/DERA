[build-system]
requires = ["setuptools>=77", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "dera-xray"
version = "0.1.0"
description = "Edge-aware, text-conditioned X-ray object detection"
readme = "README.md"
requires-python = ">=3.9,<3.11"
license = "Apache-2.0 AND LicenseRef-PiDiNet-Research-Only"
license-files = ["LICENSE", "third_party/pidinet/LICENSE"]
authors = [{name = "DERA contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.1,<2.2",
  "torchvision>=0.16,<0.17",
  "mmcv>=2.0.0rc4,<2.2.0",
  "mmengine>=0.10,<1.0",
  "mmdet==3.3.0",
  "transformers==4.28.0",
  "safetensors==0.7.0",
  "fairscale==0.4.13",
  "numpy>=1.24,<2",
  "opencv-python==4.10.0.84",
  "pycocotools>=2.0.7,<3",
  "PyYAML>=6,<7",
  "Pillow>=9.4",
]

[project.optional-dependencies]
dev = [
  "build==1.2.2.post1",
  "pre-commit==3.8.0",
  "pytest==8.3.5",
  "pytest-cov==5.0.0",
  "ruff==0.9.10",
]

[project.scripts]
dera = "dera.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["dera*", "third_party*"]
exclude = ["tests*"]

[tool.setuptools.data-files]
"share/dera" = ["NOTICE", "THIRD_PARTY_LICENSES.md"]
"share/dera/configs/_base_" = ["configs/_base_/runtime.py"]
"share/dera/configs/_base_/model" = ["configs/_base_/model/*.py"]
"share/dera/configs/_base_/schedules" = ["configs/_base_/schedules/*.py"]
"share/dera/configs/pidray" = ["configs/pidray/*.py"]
"share/dera/configs/clcxray" = ["configs/clcxray/*.py"]
"share/dera/configs/stcray" = ["configs/stcray/*.py"]
"share/dera/dataset_specs" = ["dataset_specs/*.yaml"]

[tool.setuptools.package-data]
"third_party.pidinet" = ["LICENSE", "README.md"]

[tool.ruff]
line-length = 88
target-version = "py39"
extend-exclude = ["runs", "work_dirs"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
